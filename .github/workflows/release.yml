name: Build desktop release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build ${{ matrix.label }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15-intel
            label: macOS (Intel)
            artifact: HalfFrameUtils-macOS-x86_64
          - os: macos-14
            label: macOS (Apple Silicon)
            artifact: HalfFrameUtils-macOS-arm64
          - os: windows-latest
            label: Windows
            artifact: HalfFrameUtils-Windows-x86_64
          - os: ubuntu-22.04
            label: Linux
            artifact: HalfFrameUtils-Linux-x86_64

    runs-on: ${{ matrix.os }}

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install build dependencies
        run: python -m pip install --upgrade pip pyinstaller && python -m pip install -r requirements.txt

      - name: Verify runtime imports
        run: python -c "import cv2, numpy, tkinter; print('Runtime imports OK')"

      - name: Build application
        run: >-
          python -m PyInstaller
          --noconfirm
          --clean
          --windowed
          --onedir
          --name HalfFrameUtils
          HalfFrameUtilsGUI.py

      - name: Package macOS application
        if: runner.os == 'macOS'
        run: ditto -c -k --keepParent dist/HalfFrameUtils.app ${{ matrix.artifact }}.zip

      - name: Package Windows application
        if: runner.os == 'Windows'
        shell: pwsh
        run: Compress-Archive -Path dist/HalfFrameUtils -DestinationPath ${{ matrix.artifact }}.zip

      - name: Package Linux application
        if: runner.os == 'Linux'
        run: tar -C dist -czf ${{ matrix.artifact }}.tar.gz HalfFrameUtils

      - name: Upload packaged application
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: |
            ${{ matrix.artifact }}.zip
            ${{ matrix.artifact }}.tar.gz
          if-no-files-found: error

  release:
    name: Publish GitHub release
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download packaged applications
        uses: actions/download-artifact@v4
        with:
          pattern: HalfFrameUtils-*
          path: release-assets
          merge-multiple: true

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" release-assets/* --generate-notes --title "$GITHUB_REF_NAME"
